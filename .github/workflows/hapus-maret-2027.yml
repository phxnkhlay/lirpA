name: Hapus AL Maret 2027

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-files:
    runs-on: ubuntu-latest

    steps:
      - name: Hapus AL01-AL31 Maret 2027
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=========================================="
          echo "HAPUS AL01MARET2027 - AL31MARET2027"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "=========================================="

          for i in $(seq -w 1 31); do
            FILE="AL${i}MARET2027"

            echo ""
            echo "Memproses: $FILE"

            DATA=$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/$FILE" \
              2>/dev/null || true)

            if [ -z "$DATA" ]; then
              echo "Tidak ditemukan: $FILE"
              continue
            fi

            SHA=$(echo "$DATA" | jq -r '.sha')

            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/contents/$FILE" \
              -f message="Hapus $FILE" \
              -f sha="$SHA" \
              -f branch="${GITHUB_REF_NAME}"

            echo "✓ Berhasil dihapus: $FILE"
          done

          echo ""
          echo "=========================================="
          echo "SELESAI"
          echo "=========================================="
